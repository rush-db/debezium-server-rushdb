name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the jar (versioned from the tag), runs the tests, and publishes a
# GitHub Release with the jar attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the jar asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The tag drives the artifact version: v0.2.0 -> 0.2.0
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: >
          mvn -B --no-transfer-progress versions:set
          -DnewVersion=${{ steps.ver.outputs.version }}
          -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B --no-transfer-progress clean package

      # Create the release if the tag was pushed via git; if the release was
      # made in the GitHub UI (which also creates the tag and triggers this
      # run), just attach the jar. --clobber keeps re-runs idempotent.
      - name: Publish GitHub Release with jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="target/debezium-server-rushdb-${{ steps.ver.outputs.version }}.jar"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR" --title "$GITHUB_REF_NAME" --generate-notes
          fi
