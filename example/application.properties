# Debezium Server: PostgreSQL → RushDB
# Place this in debezium-server/config/application.properties and the
# debezium-server-rushdb jar in debezium-server/lib/.

# --- sink ---------------------------------------------------------------
debezium.sink.type=rushdb
# url/api-key fall back to $RUSHDB_BASE_URL / $RUSHDB_API_KEY
#debezium.sink.rushdb.url=https://api.rushdb.com
#debezium.sink.rushdb.api-key=...
debezium.sink.rushdb.merge-strategy=append
debezium.sink.rushdb.suggest-types=true
debezium.sink.rushdb.import-chunk=500
# label overrides: entity=LABEL pairs separated by ';'
#debezium.sink.rushdb.labels=users=APP_USER;orders=ORDER
# PII suppression: comma-separated field names, matched at any depth,
# case- and separator-insensitively (fullName == full_name)
#debezium.sink.rushdb.ignore-fields=email,full_name,sin
#debezium.sink.rushdb.reserved-prefix=src
#debezium.sink.rushdb.flatten-separator=.
#debezium.sink.rushdb.singularize=true
# identity + timestamp property names (also used as the upsert merge key /
# delete filter); default syncKey / syncedAt
#debezium.sink.rushdb.sync-key-field=syncKey
#debezium.sink.rushdb.synced-at-field=syncedAt

# --- source (any Debezium connector works) --------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=app
debezium.source.database.hostname=localhost
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=${PG_PASSWORD}
debezium.source.database.dbname=app
debezium.source.table.include.list=public.users,public.orders
debezium.source.plugin.name=pgoutput

# Offsets/history are Debezium metadata (positions only — no payload data).
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=5000

# --- format: plain JSON, no schema envelope --------------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

quarkus.log.console.json=false
